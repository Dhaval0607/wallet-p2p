# Render Blueprint. Brings up the app and its Postgres together.
#
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Everything below is on Render's free tier: no card, ₹0.
services:
  - type: web
    name: wallet-p2p
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # closest to the database and to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: ADMIN_TOKEN
        generateValue: true    # Render generates a secret; read it in the dashboard
      - key: LOG_LEVEL
        value: info
      # Render's free Postgres allows very few connections, and the free web
      # service is a single instance. A small pool avoids the app itself being
      # the reason the database refuses connections.
      - key: DB_MAX_CONNS
        value: "8"
      - key: DB_MIN_CONNS
        value: "1"
      - key: LOG_RING_SIZE
        value: "5000"
      - key: APP_VERSION
        fromService:
          name: wallet-p2p
          type: web
          property: host

databases:
  - name: wallet-db
    plan: free
    region: singapore
    databaseName: wallet
    user: wallet
