# One command brings up the whole thing:
#
#   docker compose up --build
#
# then:  ./scripts/burst.sh http://localhost:8080
#
# No .env file is required -- every value below has a working default.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
      # The burst script opens ~100 connections; the default 100 leaves no room
      # for the pool's idle conns plus a psql session to look around with.
      POSTGRES_MAX_CONNECTIONS: 200
    command:
      - postgres
      - -c
      - max_connections=200
      # Log every deadlock and every lock wait over 1s. If the locking
      # discipline ever regresses, the evidence is already being captured.
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this, so the very first `compose up` does not race the
      # database's own initdb.
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet?sslmode=disable
      PORT: "8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: "20"
      APP_VERSION: ${VERSION:-compose}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The image's own HEALTHCHECK applies here too; this only shortens the
    # interval so `compose up --wait` returns quickly in development.
    healthcheck:
      test: ["CMD", "/app/wallet", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
